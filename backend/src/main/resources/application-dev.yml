spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gym_planner}
    username: ${DB_USERNAME:gym_user}
    password: ${DB_PASSWORD:gym_password}
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret: ${JWT_SECRET:change-this-dev-secret-with-at-least-32-chars}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
