<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-AR">
<head>
  <meta charset="UTF-8"/>
  <title>Rutina</title>
  <style>
    @page {
      size: A4;
      margin: 1.5cm;
      @bottom-center {
        content: element(footer);
      }
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      font-size: 10pt;
      line-height: 1.4;
    }

    .footer {
      position: running(footer);
      font-size: 7.5pt;
      color: #999;
      text-align: center;
      border-top: 1px solid #E5E7EB;
      padding-top: 4px;
    }
    .page-num:before {
      content: "Página " counter(page) " de " counter(pages);
    }

    .header {
      display: table;
      width: 100%;
      border-bottom: 2px solid #2563EB;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .header-logo {
      display: table-cell;
      width: 60px;
      vertical-align: middle;
    }
    .header-logo img {
      max-height: 50px;
      max-width: 60px;
    }
    .header-gym {
      display: table-cell;
      vertical-align: middle;
      padding-left: 14px;
    }
    .gym-name {
      font-size: 14pt;
      font-weight: bold;
      color: #111;
    }
    .gym-contact {
      font-size: 8pt;
      color: #666;
      margin-top: 2px;
    }

    .student-band {
      background: #F9FAFB;
      border-left: 3px solid #2563EB;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .routine-name {
      font-size: 13pt;
      font-weight: bold;
      color: #111;
    }
    .student-name {
      font-size: 11pt;
      color: #333;
      margin-top: 3px;
    }
    .meta-row {
      font-size: 9pt;
      color: #666;
      margin-top: 3px;
    }

    .notes-box {
      background: #FFFBEB;
      border-left: 3px solid #F59E0B;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 9pt;
    }
    .notes-label {
      font-weight: bold;
      color: #92400E;
      font-size: 8pt;
      letter-spacing: 0.05em;
    }
    .notes-content {
      margin-top: 3px;
      color: #555;
    }

    .day-header {
      border-top: 2px solid #2563EB;
      border-bottom: 1px solid #2563EB;
      padding: 9px 0 10px;
      margin-bottom: 14px;
      text-align: center;
    }
    .day-counter {
      font-size: 8pt;
      letter-spacing: 0.1em;
      color: #2563EB;
      font-weight: bold;
    }
    .day-name {
      font-size: 14pt;
      font-weight: bold;
      color: #111;
      margin-top: 2px;
    }
    .day-block {
      page-break-inside: auto;
    }
    .day-block + .day-block {
      page-break-before: always;
    }

    .section-title {
      font-size: 10pt;
      font-weight: bold;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      margin: 4px 0 8px;
      display: inline-block;
      text-transform: uppercase;
      background: white;
      border-left-width: 3px;
      border-left-style: solid;
    }
    .section-warmup {
      color: #92400E;
      border-left-color: #F59E0B;
    }
    .section-main {
      color: #065F46;
      border-left-color: #10B981;
    }
    .section-cooldown {
      color: #1E40AF;
      border-left-color: #3B82F6;
    }

    .block-card {
      border: 1px solid #E5E7EB;
      margin-bottom: 8px;
      page-break-inside: avoid;
    }
    .block-header {
      background: #F3F4F6;
      padding: 6px 10px;
    }
    .block-title-row {
      display: table;
      width: 100%;
    }
    .block-title-side {
      display: table-cell;
      width: 90px;
    }
    .block-title {
      display: table-cell;
      font-size: 10pt;
      font-weight: bold;
      text-align: center;
    }
    .block-type {
      text-align: right;
      font-size: 8pt;
      color: #666;
    }
    .block-type-badge {
      background: white;
      padding: 2px 6px;
      border: 1px solid #E5E7EB;
    }
    .circuit-badge {
      background: #FEF3C7;
      color: #92400E;
      padding: 2px 6px;
      border: 1px solid #FDE68A;
    }
    .circuit-note {
      background: #FFFBEB;
      color: #92400E;
      padding: 7px 10px;
      font-size: 9pt;
      border-bottom: 1px solid #FDE68A;
    }
    .block-notes {
      background: #F9FAFB;
      color: #4B5563;
      padding: 7px 10px;
      font-size: 9pt;
      border-bottom: 1px solid #E5E7EB;
    }

    table.exercises {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
    }
    table.exercises th {
      background: #FAFAFA;
      padding: 5px 8px;
      text-align: left;
      font-size: 8pt;
      font-weight: bold;
      color: #555;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid #E5E7EB;
    }
    table.exercises td {
      padding: 5px 8px;
      border-bottom: 1px solid #F3F4F6;
      vertical-align: top;
    }
    .exercise-name {
      font-weight: bold;
    }
    .exercise-notes {
      font-size: 7.5pt;
      color: #555;
      margin-top: 4px;
      padding: 3px 6px;
      background: #F9FAFB;
      border-left: 2px solid #D1D5DB;
    }
    .exercise-notes-label {
      font-weight: bold;
      color: #4B5563;
    }
  </style>
</head>
<body>
  <div class="footer">
    <span class="page-num"></span>
  </div>

  <div th:each="day, dayStat : ${data.days}" class="day-block">
    <div class="header" th:style="'border-bottom: 2px solid ' + ${data.metadata.gym.primaryColor}">
      <div class="header-logo">
        <img th:if="${data.metadata.gym.logoUrl != null}" th:src="${data.metadata.gym.logoUrl}" alt="Logo"/>
      </div>
      <div class="header-gym">
        <div class="gym-name" th:text="${data.metadata.gym.name}">Gym</div>
        <div class="gym-contact">
          <span th:if="${data.metadata.gym.address != null}" th:text="${data.metadata.gym.address}"></span>
          <span th:if="${data.metadata.gym.address != null and data.metadata.gym.phone != null}"> · </span>
          <span th:if="${data.metadata.gym.phone != null}" th:text="${data.metadata.gym.phone}"></span>
          <span th:if="${data.metadata.gym.phone != null and data.metadata.gym.email != null}"> · </span>
          <span th:if="${data.metadata.gym.email != null}" th:text="${data.metadata.gym.email}"></span>
        </div>
      </div>
    </div>

    <div class="student-band" th:style="'border-left: 3px solid ' + ${data.metadata.gym.primaryColor}">
      <div class="routine-name" th:text="${data.metadata.routineName}">Rutina</div>
      <div class="student-name" th:text="${data.metadata.studentFullName}">Alumno</div>
      <div class="meta-row">
        <span th:text="${data.metadata.assignedDateFormatted}">11/05/2026</span>
        <span th:if="${data.metadata.objective != null}"> · Objetivo: </span>
        <span th:if="${data.metadata.objective != null}" th:text="${data.metadata.objective}"></span>
        <span th:if="${data.metadata.sport != null}"> · </span>
        <span th:if="${data.metadata.sport != null}" th:text="${data.metadata.sport}"></span>
      </div>
    </div>

    <div th:if="${dayStat.first and data.generalNotes != null and !#strings.isEmpty(#strings.trim(data.generalNotes))}" class="notes-box">
      <div class="notes-label">NOTAS</div>
      <div class="notes-content" th:text="${data.generalNotes}">Notas generales</div>
    </div>

    <div class="day-header" th:style="'border-top: 2px solid ' + ${data.metadata.gym.primaryColor} + '; border-bottom: 1px solid ' + ${data.metadata.gym.primaryColor}">
      <div class="day-counter" th:style="'color: ' + ${data.metadata.gym.primaryColor}">
        DÍA <span th:text="${dayStat.count}">1</span> DE <span th:text="${data.days.size()}">2</span>
      </div>
      <div class="day-name" th:text="${day.name}">Día 1</div>
    </div>

    <div th:each="section : ${day.sections}">
      <div class="section-title" th:classappend="${'section-' + section.kind}" th:text="${section.title}">CALENTAMIENTO</div>

      <div th:each="block : ${section.blocks}" class="block-card">
        <div class="block-header">
          <div class="block-title-row">
            <span class="block-title-side"></span>
            <span class="block-title" th:text="${block.title}">Bloque</span>
            <span class="block-title-side block-type">
              <span th:if="${block.typeLabel != null and !#strings.isEmpty(#strings.trim(block.typeLabel))}" th:class="${block.isCircuit} ? 'circuit-badge' : 'block-type-badge'" th:text="${block.typeLabel}">Estándar</span>
            </span>
          </div>
        </div>

        <div th:if="${block.circuitNote != null and !#strings.isEmpty(#strings.trim(block.circuitNote))}" class="circuit-note" th:text="${block.circuitNote}">Rotar</div>
        <div th:if="${block.blockNotes != null and !#strings.isEmpty(#strings.trim(block.blockNotes))}" class="block-notes" th:text="${block.blockNotes}">Notas del bloque</div>

        <table class="exercises">
          <thead>
            <tr>
              <th>Ejercicio</th>
              <th th:each="col : ${block.columns}" th:text="${col}">Reps</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row : ${block.rows}">
              <td th:if="${row.spanRow}" th:rowspan="${row.rowspan}">
                <div class="exercise-name" th:text="${row.exerciseName}">Ejercicio</div>
                <div th:if="${row.exerciseNotes != null and !#strings.isEmpty(#strings.trim(row.exerciseNotes))}" class="exercise-notes">
                  <span class="exercise-notes-label">Nota:</span> <span th:text="${row.exerciseNotes}">Notas</span>
                </div>
              </td>
              <td th:each="cell : ${row.pdfCells}" th:text="${cell}">-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
