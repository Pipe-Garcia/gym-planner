spring:
  datasource:
    url: jdbc:h2:mem:gymplanner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/test-migration

jwt:
  secret: test-secret-with-at-least-32-characters

cors:
  allowed-origins: http://localhost:5173

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
